name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
